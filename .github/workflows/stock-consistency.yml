name: Cek konsistensi stok

# Panggil endpoint read-only /api/automation/stock-consistency tiap hari.
# Workflow jadi MERAH (+ email) hanya kalau jumlah selisih NYATA melebihi
# baseline di .github/stock-consistency-baseline.json — jadi 2 selisih lama
# yang sengaja dibiarkan tidak bikin alert palsu tiap hari, tapi drift BARU
# tetap ketahuan. Tidak menulis apa pun ke DB.
#
# Secret yang dibutuhkan (sama seperti workflow backup):
#   AUTOMATION_API_KEY - sama dengan env var di Railway

on:
  schedule:
    - cron: "0 20 * * *" # 20:00 UTC = 03:00 WIB, tiap hari
  workflow_dispatch: {}

concurrency:
  group: stock-consistency
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/stock-consistency-baseline.json
          sparse-checkout-cone-mode: false

      - name: Panggil endpoint & evaluasi
        env:
          URL: https://backend-production-5543.up.railway.app/api/automation/stock-consistency
          AUTOMATION_API_KEY: ${{ secrets.AUTOMATION_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUTOMATION_API_KEY}" ]; then
            echo "::error::Secret AUTOMATION_API_KEY belum di-set"; exit 1
          fi
          curl -fsSL --retry 3 --retry-delay 15 --max-time 120 \
            -H "X-Automation-Key: ${AUTOMATION_API_KEY}" \
            -o result.json "${URL}"

          echo "----- ringkasan -----"
          jq '.summary' result.json

          BASELINE=$(jq -r '.acceptedRealMismatches' .github/stock-consistency-baseline.json)
          REAL=$(jq -r '[.summary.globalVsDivisionSum, .summary.serialVsMaterialStock, .summary.negatives, .summary.orphans] | add' result.json)
          echo "Selisih nyata: ${REAL}  |  baseline yang diterima: ${BASELINE}"

          if [ "$REAL" -gt "$BASELINE" ]; then
            echo "::error::Ada drift stok BARU (${REAL} > baseline ${BASELINE})"
            jq '{globalVsDivisionSum, serialVsMaterialStock, negatives, orphans}' result.json
            echo ""
            echo "Settings -> \"Periksa Konsistensi Stok\" (login Manager) untuk detail lengkap."
            echo "Kalau drift baru ini memang mau diterima, naikkan acceptedRealMismatches di .github/stock-consistency-baseline.json."
            exit 1
          fi

          if [ "$REAL" -lt "$BASELINE" ]; then
            echo "::warning::Selisih nyata (${REAL}) lebih kecil dari baseline (${BASELINE}) — turunkan acceptedRealMismatches di baseline file."
          fi
          echo "Tidak ada drift baru ✓"
